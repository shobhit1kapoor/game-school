<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 768" preserveAspectRatio="xMidYMid slice">
  <!-- Resting in the Lake — mirror lake at golden hour, deer, duck family, cattails -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e7b2"/>
      <stop offset="0.5" stop-color="#f3d28f"/>
      <stop offset="1" stop-color="#e8c987"/>
    </linearGradient>
    <linearGradient id="hillsFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8f9c"/>
      <stop offset="1" stop-color="#a3a59e"/>
    </linearGradient>
    <linearGradient id="hillsMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e7b6a"/>
      <stop offset="1" stop-color="#83907a"/>
    </linearGradient>
    <linearGradient id="hillsNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f6b4f"/>
      <stop offset="1" stop-color="#5e7a58"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fc6d8"/>
      <stop offset="0.35" stop-color="#7fb0c4"/>
      <stop offset="0.7" stop-color="#a8c8d3"/>
      <stop offset="1" stop-color="#cbdde2"/>
    </linearGradient>
    <linearGradient id="lakeBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d28f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f3d28f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.6" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#fcedb8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fcedb8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1536" height="768" fill="url(#sky)"/>
  <rect width="1536" height="768" fill="url(#sunGlow)"/>
  <!-- low sun -->
  <circle cx="920" cy="200" r="48" fill="#fcedb8" opacity="0.85"/>

  <!-- Far hills -->
  <path d="M0,360 Q200,290 420,340 T880,330 Q1100,300 1320,345 T1536,335 V440 H0 Z" fill="url(#hillsFar)" opacity="0.85"/>
  <!-- Mid hills -->
  <path d="M0,400 Q220,340 460,390 T940,385 Q1180,355 1380,395 T1536,388 V450 H0 Z" fill="url(#hillsMid)"/>
  <!-- Near hills -->
  <path d="M0,440 Q260,400 520,435 T1040,430 Q1240,408 1420,435 T1536,432 V475 H0 Z" fill="url(#hillsNear)"/>

  <!-- Lake -->
  <rect x="0" y="475" width="1536" height="293" fill="url(#lake)"/>
  <!-- Golden reflection band -->
  <rect x="0" y="475" width="1536" height="120" fill="url(#lakeBand)"/>

  <!-- Blurred inverted hill reflections -->
  <path d="M0,475 Q220,520 460,488 T940,492 Q1180,520 1380,492 T1536,498 V540 H0 Z" fill="#7f8a78" opacity="0.45"/>
  <path d="M0,475 Q260,510 520,485 T1040,488 Q1240,508 1420,488 T1536,490 V515 H0 Z" fill="#5e7a58" opacity="0.4"/>

  <!-- Horizontal reflection bands -->
  <g fill="#ffffff" opacity="0.35">
    <rect x="0" y="510" width="1536" height="2"/>
    <rect x="0" y="540" width="1536" height="1.5"/>
    <rect x="0" y="575" width="1536" height="1.5"/>
    <rect x="0" y="612" width="1536" height="1.2"/>
    <rect x="0" y="650" width="1536" height="1.2"/>
  </g>
  <!-- Sun reflection column -->
  <g fill="#fcedb8" opacity="0.55">
    <ellipse cx="920" cy="495" rx="60" ry="4"/>
    <ellipse cx="920" cy="525" rx="48" ry="3"/>
    <ellipse cx="920" cy="555" rx="38" ry="2.5"/>
    <ellipse cx="920" cy="585" rx="28" ry="2"/>
  </g>

  <!-- Left shore (where deer stands) -->
  <path d="M0,452 Q160,438 320,455 Q420,468 480,490 L480,475 L0,475 Z" fill="#6f7d54"/>
  <path d="M0,468 Q140,455 300,470 Q380,478 460,492 L460,478 L0,478 Z" fill="#5d6b46"/>

  <!-- Right shallows shore -->
  <path d="M1100,478 Q1280,468 1420,478 Q1500,484 1536,485 L1536,475 L1100,475 Z" fill="#6f7d54"/>

  <!-- Deer at (307, 422) drinking, on left shore -->
  <g transform="translate(307,422)">
    <!-- back legs -->
    <rect x="14" y="20" width="6" height="36" fill="#8d6b4a"/>
    <rect x="24" y="20" width="6" height="36" fill="#7a5a3d"/>
    <!-- body -->
    <ellipse cx="0" cy="14" rx="44" ry="18" fill="#8d6b4a"/>
    <!-- belly shadow -->
    <ellipse cx="0" cy="22" rx="38" ry="10" fill="#6e5236" opacity="0.7"/>
    <!-- front legs -->
    <rect x="-30" y="22" width="6" height="36" fill="#8d6b4a"/>
    <rect x="-20" y="22" width="6" height="36" fill="#7a5a3d"/>
    <!-- neck (lowered to drink) -->
    <path d="M-38,8 Q-54,22 -64,42 L-58,50 Q-48,30 -34,18 Z" fill="#8d6b4a"/>
    <!-- head -->
    <ellipse cx="-64" cy="48" rx="10" ry="7" fill="#8d6b4a"/>
    <path d="M-72,46 L-78,50 L-72,52 Z" fill="#5d4530"/>
    <!-- ear -->
    <path d="M-58,40 L-54,30 L-50,40 Z" fill="#7a5a3d"/>
    <!-- tail -->
    <path d="M42,8 Q48,4 50,12 L44,16 Z" fill="#7a5a3d"/>
    <!-- eye -->
    <circle cx="-66" cy="46" r="0.9" fill="#1a1108"/>
    <!-- ripples by mouth -->
    <ellipse cx="-66" cy="58" rx="14" ry="2" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Duck family at (845, 461) -->
  <g transform="translate(845,461)">
    <!-- mama duck -->
    <ellipse cx="0" cy="8" rx="22" ry="10" fill="#2b4a4a"/>
    <ellipse cx="-14" cy="2" rx="10" ry="9" fill="#2b4a4a"/>
    <path d="M-22,2 L-30,4 L-22,6 Z" fill="#d6a23a"/>
    <circle cx="-17" cy="0" r="1.2" fill="#0a1410"/>
    <ellipse cx="0" cy="20" rx="30" ry="3" fill="#ffffff" opacity="0.5"/>
    <!-- ducklings -->
    <g transform="translate(38,18)">
      <ellipse cx="0" cy="4" rx="11" ry="6" fill="#3a5a58"/>
      <ellipse cx="-7" cy="1" rx="5" ry="5" fill="#3a5a58"/>
      <path d="M-12,1 L-17,2 L-12,3 Z" fill="#d6a23a"/>
      <circle cx="-9" cy="0" r="0.8" fill="#0a1410"/>
      <ellipse cx="0" cy="12" rx="16" ry="2" fill="#ffffff" opacity="0.45"/>
    </g>
    <g transform="translate(60,30)">
      <ellipse cx="0" cy="4" rx="11" ry="6" fill="#3a5a58"/>
      <ellipse cx="-7" cy="1" rx="5" ry="5" fill="#3a5a58"/>
      <path d="M-12,1 L-17,2 L-12,3 Z" fill="#d6a23a"/>
      <circle cx="-9" cy="0" r="0.8" fill="#0a1410"/>
      <ellipse cx="0" cy="12" rx="16" ry="2" fill="#ffffff" opacity="0.45"/>
    </g>
    <g transform="translate(82,22)">
      <ellipse cx="0" cy="4" rx="11" ry="6" fill="#3a5a58"/>
      <ellipse cx="-7" cy="1" rx="5" ry="5" fill="#3a5a58"/>
      <path d="M-12,1 L-17,2 L-12,3 Z" fill="#d6a23a"/>
      <circle cx="-9" cy="0" r="0.8" fill="#0a1410"/>
      <ellipse cx="0" cy="12" rx="16" ry="2" fill="#ffffff" opacity="0.45"/>
    </g>
  </g>

  <!-- Reeds and cattails at (1229, 576) -->
  <g transform="translate(1229,576)">
    <!-- blades -->
    <g stroke="#2c4a2a" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M-30,40 Q-26,0 -22,-60"/>
      <path d="M-10,40 Q-6,-4 0,-72"/>
      <path d="M14,40 Q18,4 24,-50"/>
      <path d="M32,40 Q36,8 42,-40"/>
      <path d="M-44,40 Q-42,12 -38,-30"/>
      <path d="M50,40 Q52,18 56,-20"/>
    </g>
    <!-- thinner blades -->
    <g stroke="#3a6238" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M-22,40 Q-18,8 -14,-44"/>
      <path d="M4,40 Q8,10 12,-32"/>
      <path d="M22,40 Q26,14 30,-26"/>
      <path d="M-36,40 Q-34,18 -30,-12"/>
      <path d="M42,40 Q44,20 48,-8"/>
    </g>
    <!-- cattail stems -->
    <line x1="-22" y1="-60" x2="-22" y2="-44" stroke="#3a4a28" stroke-width="2"/>
    <line x1="0" y1="-72" x2="0" y2="-54" stroke="#3a4a28" stroke-width="2"/>
    <line x1="24" y1="-50" x2="24" y2="-36" stroke="#3a4a28" stroke-width="2"/>
    <!-- cattail heads -->
    <rect x="-26" y="-78" width="8" height="20" rx="3" fill="#5d4a36"/>
    <rect x="-4" y="-90" width="8" height="22" rx="3" fill="#5d4a36"/>
    <rect x="20" y="-68" width="8" height="20" rx="3" fill="#5d4a36"/>
    <!-- tiny tops -->
    <line x1="-22" y1="-80" x2="-22" y2="-86" stroke="#3a4a28" stroke-width="1.5"/>
    <line x1="0" y1="-92" x2="0" y2="-98" stroke="#3a4a28" stroke-width="1.5"/>
    <line x1="24" y1="-70" x2="24" y2="-76" stroke="#3a4a28" stroke-width="1.5"/>
  </g>
</svg>
