<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 768" preserveAspectRatio="xMidYMid slice">
  <!-- Down the Drain — cutaway under the city street with pipes to wastewater plant to river -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8cee0"/>
      <stop offset="1" stop-color="#d8e7e3"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a7a7a"/>
      <stop offset="1" stop-color="#5d5d5d"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a6248"/>
      <stop offset="0.6" stop-color="#6a5440"/>
      <stop offset="1" stop-color="#5d4a36"/>
    </linearGradient>
    <linearGradient id="pipeMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8b0b6"/>
      <stop offset="1" stop-color="#7a838c"/>
    </linearGradient>
    <linearGradient id="pipeCopper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c89b6a"/>
      <stop offset="1" stop-color="#9a7148"/>
    </linearGradient>
    <linearGradient id="dirtyWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ea6c4"/>
      <stop offset="1" stop-color="#2f87a3"/>
    </linearGradient>
    <linearGradient id="cleanWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ed5e0"/>
      <stop offset="1" stop-color="#7fc4d4"/>
    </linearGradient>
    <linearGradient id="houseWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e4cb"/>
      <stop offset="1" stop-color="#e0d3b6"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.3" cy="0.1" r="0.4">
      <stop offset="0" stop-color="#f6e7b2" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f6e7b2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky strip above -->
  <rect width="1536" height="140" fill="url(#sky)"/>
  <rect width="1536" height="140" fill="url(#sunGlow)"/>
  <!-- distant clouds -->
  <ellipse cx="380" cy="60" rx="100" ry="18" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="1100" cy="50" rx="120" ry="20" fill="#ffffff" opacity="0.65"/>

  <!-- Street surface -->
  <rect x="0" y="140" width="1536" height="80" fill="url(#street)"/>
  <!-- street dashed centerline -->
  <g fill="#f1e9d6">
    <rect x="60" y="178" width="50" height="6" rx="2"/>
    <rect x="180" y="178" width="50" height="6" rx="2"/>
    <rect x="300" y="178" width="50" height="6" rx="2"/>
    <rect x="700" y="178" width="50" height="6" rx="2"/>
    <rect x="820" y="178" width="50" height="6" rx="2"/>
    <rect x="940" y="178" width="50" height="6" rx="2"/>
    <rect x="1200" y="178" width="50" height="6" rx="2"/>
    <rect x="1320" y="178" width="50" height="6" rx="2"/>
  </g>
  <!-- curb -->
  <rect x="0" y="218" width="1536" height="6" fill="#3a3a3a"/>

  <!-- House on the left, sitting on street level -->
  <g transform="translate(420,40)">
    <!-- body -->
    <rect x="0" y="40" width="180" height="100" rx="4" fill="url(#houseWall)"/>
    <!-- roof -->
    <path d="M-12,42 L90,-22 L192,42 Z" fill="#a14e30"/>
    <path d="M-12,42 L192,42 L186,52 L0,52 Z" fill="#7a3a22"/>
    <!-- chimney -->
    <rect x="130" y="-8" width="22" height="32" rx="2" fill="#7a3a22"/>
    <ellipse cx="141" cy="-14" rx="14" ry="6" fill="#cfd8da" opacity="0.7"/>
    <!-- door -->
    <rect x="78" y="80" width="34" height="60" rx="3" fill="#5d4a36"/>
    <circle cx="105" cy="112" r="2" fill="#d8b890"/>
    <!-- windows -->
    <rect x="18" y="64" width="36" height="36" rx="3" fill="#7fb0c4"/>
    <line x1="36" y1="64" x2="36" y2="100" stroke="#e8dcc3" stroke-width="2"/>
    <line x1="18" y1="82" x2="54" y2="82" stroke="#e8dcc3" stroke-width="2"/>
    <rect x="128" y="64" width="36" height="36" rx="3" fill="#7fb0c4"/>
    <line x1="146" y1="64" x2="146" y2="100" stroke="#e8dcc3" stroke-width="2"/>
    <line x1="128" y1="82" x2="164" y2="82" stroke="#e8dcc3" stroke-width="2"/>
  </g>
  <!-- little bush by house -->
  <g transform="translate(380,180)">
    <ellipse cx="0" cy="0" rx="18" ry="14" fill="#3e6b4e"/>
    <ellipse cx="-6" cy="-4" rx="10" ry="9" fill="#54845f"/>
  </g>

  <!-- A couple of small buildings on the right of street -->
  <g transform="translate(940,40)">
    <rect x="0" y="50" width="120" height="90" rx="3" fill="#cfd6db"/>
    <rect x="0" y="50" width="120" height="8" fill="#8d99a6"/>
    <g fill="#7fb0c4">
      <rect x="14" y="68" width="22" height="26" rx="2"/>
      <rect x="50" y="68" width="22" height="26" rx="2"/>
      <rect x="86" y="68" width="22" height="26" rx="2"/>
      <rect x="14" y="104" width="22" height="26" rx="2"/>
      <rect x="50" y="104" width="22" height="26" rx="2"/>
      <rect x="86" y="104" width="22" height="26" rx="2"/>
    </g>
  </g>
  <g transform="translate(1100,60)">
    <rect x="0" y="30" width="100" height="110" rx="3" fill="#e0d3b6"/>
    <path d="M-6,32 L50,-6 L106,32 Z" fill="#a14e30"/>
    <rect x="40" y="80" width="20" height="60" rx="2" fill="#5d4a36"/>
    <rect x="12" y="44" width="22" height="22" rx="2" fill="#7fb0c4"/>
    <rect x="66" y="44" width="22" height="22" rx="2" fill="#7fb0c4"/>
  </g>
  <!-- street tree -->
  <g transform="translate(820,140)">
    <rect x="-4" y="-30" width="8" height="35" rx="2" fill="#5d4a36"/>
    <ellipse cx="0" cy="-50" rx="28" ry="32" fill="#3e6b4e"/>
    <ellipse cx="-6" cy="-58" rx="18" ry="22" fill="#54845f"/>
  </g>

  <!-- Underground ground -->
  <rect x="0" y="224" width="1536" height="544" fill="url(#ground)"/>
  <!-- soil texture: little stones and roots -->
  <g fill="#4a3a2a" opacity="0.55">
    <ellipse cx="120" cy="320" rx="6" ry="3"/>
    <ellipse cx="260" cy="430" rx="8" ry="4"/>
    <ellipse cx="400" cy="600" rx="7" ry="3"/>
    <ellipse cx="640" cy="540" rx="6" ry="3"/>
    <ellipse cx="780" cy="700" rx="9" ry="4"/>
    <ellipse cx="1180" cy="430" rx="7" ry="3"/>
    <ellipse cx="1380" cy="640" rx="8" ry="4"/>
  </g>
  <g stroke="#3a2e22" stroke-width="2" fill="none" opacity="0.5">
    <path d="M180,224 q-8,30 4,60 q-10,30 6,60"/>
    <path d="M720,224 q10,40 -6,80"/>
    <path d="M1240,224 q-6,50 8,90"/>
  </g>
  <!-- a small earthworm and a root pebble for whimsy -->
  <g transform="translate(220,560)">
    <path d="M0,0 q10,-8 20,0 q10,8 20,0 q10,-8 20,0" fill="none" stroke="#c98686" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Drain pipe coming down from house (start near 461,269) -->
  <g>
    <!-- vertical drop from house into ground -->
    <rect x="448" y="224" width="26" height="80" rx="6" fill="url(#pipeCopper)"/>
    <rect x="448" y="224" width="26" height="6" rx="3" fill="#e2bd92"/>
    <!-- elbow -->
    <path d="M448,300 Q448,330 480,330 L520,330 Q540,330 540,350 L540,400" fill="none" stroke="#b08758" stroke-width="26" stroke-linecap="round"/>
    <!-- water inside the start (visible top of vertical pipe) -->
    <rect x="455" y="232" width="12" height="70" rx="4" fill="url(#dirtyWater)"/>
  </g>

  <!-- Main horizontal pipe heading right toward the plant -->
  <g>
    <rect x="500" y="380" width="380" height="42" rx="20" fill="url(#pipeMetal)"/>
    <rect x="500" y="380" width="380" height="10" rx="5" fill="#c2cad0"/>
    <!-- joints -->
    <rect x="600" y="376" width="14" height="50" rx="4" fill="#5d6973"/>
    <rect x="720" y="376" width="14" height="50" rx="4" fill="#5d6973"/>
    <rect x="840" y="376" width="14" height="50" rx="4" fill="#5d6973"/>
    <!-- water inside (show a stripe down the middle that reads as flowing water) -->
    <rect x="510" y="394" width="360" height="16" rx="6" fill="url(#dirtyWater)"/>
    <g fill="#bde2ec" opacity="0.7">
      <ellipse cx="560" cy="402" rx="12" ry="2"/>
      <ellipse cx="660" cy="402" rx="14" ry="2"/>
      <ellipse cx="780" cy="402" rx="12" ry="2"/>
    </g>
  </g>

  <!-- A secondary feeder pipe coming down from upper area on right side of street into main pipe (extra detail) -->
  <g>
    <path d="M820,224 L820,300 Q820,330 800,330" fill="none" stroke="#b08758" stroke-width="22" stroke-linecap="round"/>
    <rect x="811" y="232" width="10" height="60" rx="3" fill="url(#dirtyWater)"/>
  </g>

  <!-- Wastewater plant chamber (922,422) -->
  <g transform="translate(922,422)">
    <!-- tank outer -->
    <rect x="-170" y="-60" width="340" height="180" rx="14" fill="#6f7e8a"/>
    <rect x="-160" y="-50" width="320" height="160" rx="10" fill="#8d99a6"/>
    <!-- inner water -->
    <rect x="-148" y="-30" width="296" height="130" rx="6" fill="url(#dirtyWater)"/>
    <!-- bubbles -->
    <g fill="#dff0f4" opacity="0.85">
      <circle cx="-100" cy="40" r="7"/>
      <circle cx="-72" cy="62" r="5"/>
      <circle cx="-40" cy="20" r="9"/>
      <circle cx="-10" cy="48" r="6"/>
      <circle cx="20" cy="74" r="5"/>
      <circle cx="70" cy="34" r="8"/>
      <circle cx="106" cy="60" r="6"/>
      <circle cx="130" cy="20" r="5"/>
    </g>
    <!-- paddle wheel -->
    <g transform="translate(0,-10)">
      <circle cx="0" cy="0" r="34" fill="#5d4a36"/>
      <circle cx="0" cy="0" r="28" fill="#b08758"/>
      <g stroke="#5d4a36" stroke-width="6" stroke-linecap="round">
        <line x1="0" y1="-28" x2="0" y2="28"/>
        <line x1="-28" y1="0" x2="28" y2="0"/>
        <line x1="-20" y1="-20" x2="20" y2="20"/>
        <line x1="-20" y1="20" x2="20" y2="-20"/>
      </g>
      <circle cx="0" cy="0" r="6" fill="#5d4a36"/>
    </g>
    <!-- water-level highlight -->
    <rect x="-148" y="-30" width="296" height="6" rx="2" fill="#bde2ec" opacity="0.7"/>
    <!-- top supports / chamber lip -->
    <rect x="-170" y="-66" width="340" height="10" rx="3" fill="#5d6973"/>
    <!-- intake from left pipe -->
    <rect x="-200" y="-26" width="36" height="22" rx="5" fill="#8d99a6"/>
    <!-- outflow on right -->
    <rect x="160" y="40" width="42" height="22" rx="5" fill="#a8b0b6"/>
  </g>

  <!-- Clean-water outflow pipe from plant to river (lower-right ~ 1306,538) -->
  <g>
    <!-- horizontal then bending down -->
    <path d="M1090,478 L1240,478 Q1280,478 1280,520 L1280,560" fill="none" stroke="#a8b0b6" stroke-width="34" stroke-linecap="round"/>
    <path d="M1090,478 L1240,478 Q1280,478 1280,520 L1280,560" fill="none" stroke="#c2cad0" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
    <!-- clean water inside pipe -->
    <path d="M1095,478 L1238,478 Q1268,478 1268,518 L1268,556" fill="none" stroke="url(#cleanWater)" stroke-width="14" stroke-linecap="round"/>
    <!-- sparkle marks on clean water -->
    <g fill="#ffffff" opacity="0.85">
      <circle cx="1140" cy="478" r="2.5"/>
      <circle cx="1180" cy="478" r="2"/>
      <circle cx="1220" cy="478" r="2.5"/>
      <circle cx="1270" cy="520" r="2"/>
      <circle cx="1268" cy="548" r="2.5"/>
    </g>
  </g>

  <!-- River exit basin at lower-right -->
  <g transform="translate(1306,580)">
    <!-- soil cutaway -->
    <path d="M-40,0 Q60,-10 230,5 L230,180 L-40,180 Z" fill="#4a3a2a" opacity="0.5"/>
    <!-- river water -->
    <path d="M-50,12 Q60,4 230,18 L230,180 L-50,180 Z" fill="url(#cleanWater)"/>
    <!-- exit pipe lip dripping into river -->
    <rect x="-50" y="-22" width="34" height="32" rx="5" fill="#8d99a6"/>
    <rect x="-50" y="-22" width="34" height="8" rx="3" fill="#c2cad0"/>
    <!-- pouring sparkle into river -->
    <rect x="-40" y="-12" width="14" height="34" rx="4" fill="#bde2ec"/>
    <ellipse cx="-32" cy="22" rx="14" ry="3" fill="#ffffff" opacity="0.85"/>
    <!-- river ripples -->
    <g fill="#ffffff" opacity="0.7">
      <ellipse cx="40" cy="40" rx="30" ry="2"/>
      <ellipse cx="120" cy="60" rx="40" ry="2"/>
      <ellipse cx="180" cy="90" rx="36" ry="2"/>
      <ellipse cx="80" cy="110" rx="44" ry="2"/>
      <ellipse cx="160" cy="140" rx="48" ry="2"/>
    </g>
    <!-- sparkles -->
    <g fill="#ffffff">
      <circle cx="50" cy="30" r="2"/>
      <circle cx="100" cy="80" r="1.5"/>
      <circle cx="170" cy="50" r="2"/>
      <circle cx="200" cy="110" r="1.5"/>
    </g>
  </g>

  <!-- A friendly little fish in the river -->
  <g transform="translate(1410,680)">
    <ellipse cx="0" cy="0" rx="18" ry="9" fill="#f0a85a"/>
    <path d="M14,0 L26,-8 L26,8 Z" fill="#f0a85a"/>
    <circle cx="-8" cy="-2" r="2" fill="#ffffff"/>
    <circle cx="-8" cy="-2" r="1" fill="#2a2a2a"/>
  </g>
</svg>
