<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 768" preserveAspectRatio="xMidYMid slice">
  <!-- Water at Home — cozy kitchen, glass left, sink center, stove right -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7efd9"/>
      <stop offset="1" stop-color="#ead9b6"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b08758"/>
      <stop offset="1" stop-color="#8d6b4a"/>
    </linearGradient>
    <linearGradient id="counterFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d6b4a"/>
      <stop offset="1" stop-color="#6e5238"/>
    </linearGradient>
    <linearGradient id="skySmall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8cee0"/>
      <stop offset="1" stop-color="#d8e7e3"/>
    </linearGradient>
    <linearGradient id="hillSmall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa46c"/>
      <stop offset="1" stop-color="#5d8a57"/>
    </linearGradient>
    <linearGradient id="waterStream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8d6e3"/>
      <stop offset="1" stop-color="#9fc6d8"/>
    </linearGradient>
    <radialGradient id="warmLight" cx="0.5" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#f6e7b2" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f6e7b2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Wall -->
  <rect width="1536" height="768" fill="url(#wall)"/>
  <rect width="1536" height="768" fill="url(#warmLight)"/>

  <!-- Wood-panel subtle stripes on upper wall -->
  <g stroke="#dcc89d" stroke-width="1" opacity="0.4">
    <line x1="0" y1="160" x2="1536" y2="160"/>
    <line x1="0" y1="240" x2="1536" y2="240"/>
  </g>

  <!-- Window over the sink -->
  <g transform="translate(540,90)">
    <rect x="-10" y="-10" width="320" height="280" rx="10" fill="#8d6b4a"/>
    <rect x="0" y="0" width="300" height="260" rx="4" fill="url(#skySmall)"/>
    <!-- distant hills -->
    <path d="M0,170 Q60,140 130,160 T260,150 Q290,140 300,150 V260 H0 Z" fill="url(#hillSmall)"/>
    <path d="M0,200 Q80,180 170,195 T300,190 V260 H0 Z" fill="#4a7355"/>
    <!-- sun -->
    <circle cx="230" cy="60" r="22" fill="#f6e7b2" opacity="0.9"/>
    <!-- cloud -->
    <ellipse cx="80" cy="70" rx="44" ry="12" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="110" cy="62" rx="28" ry="9" fill="#ffffff" opacity="0.8"/>
    <!-- bird specks -->
    <path d="M150,90 q6,-5 12,0 q6,-5 12,0" fill="none" stroke="#5d6973" stroke-width="1.5" stroke-linecap="round"/>
    <!-- window mullions -->
    <line x1="150" y1="0" x2="150" y2="260" stroke="#8d6b4a" stroke-width="6"/>
    <line x1="0" y1="130" x2="300" y2="130" stroke="#8d6b4a" stroke-width="6"/>
    <!-- frame thickness -->
    <rect x="0" y="0" width="300" height="260" rx="4" fill="none" stroke="#6e5238" stroke-width="3"/>
  </g>

  <!-- Potted plant on the windowsill (left side of window) -->
  <g transform="translate(470,355)">
    <rect x="-26" y="0" width="52" height="36" rx="4" fill="#a14e30"/>
    <rect x="-28" y="-4" width="56" height="10" rx="3" fill="#7a3a22"/>
    <!-- leaves -->
    <ellipse cx="-12" cy="-14" rx="14" ry="22" fill="#3e6b4e" transform="rotate(-22 -12 -14)"/>
    <ellipse cx="8" cy="-22" rx="13" ry="24" fill="#54845f" transform="rotate(10 8 -22)"/>
    <ellipse cx="20" cy="-10" rx="12" ry="18" fill="#3e6b4e" transform="rotate(28 20 -10)"/>
    <ellipse cx="-2" cy="-30" rx="10" ry="18" fill="#6b9a6f"/>
  </g>

  <!-- Small wall shelf with jars (right wall) -->
  <g transform="translate(1240,200)">
    <rect x="0" y="0" width="230" height="10" rx="2" fill="#8d6b4a"/>
    <!-- jars -->
    <g>
      <rect x="20" y="-44" width="36" height="44" rx="4" fill="#e7d9b8" opacity="0.85"/>
      <rect x="20" y="-44" width="36" height="6" rx="2" fill="#a14e30"/>
    </g>
    <g>
      <rect x="78" y="-52" width="40" height="52" rx="5" fill="#cfd6db" opacity="0.85"/>
      <rect x="78" y="-52" width="40" height="6" rx="2" fill="#5d6973"/>
    </g>
    <g>
      <rect x="138" y="-40" width="34" height="40" rx="4" fill="#d8b890" opacity="0.85"/>
      <rect x="138" y="-40" width="34" height="6" rx="2" fill="#7a3a22"/>
    </g>
    <g>
      <rect x="186" y="-46" width="32" height="46" rx="4" fill="#b3d3df" opacity="0.85"/>
      <rect x="186" y="-46" width="32" height="6" rx="2" fill="#5d6973"/>
    </g>
  </g>

  <!-- A wall-hung utensil or hanging mug rack on left wall -->
  <g transform="translate(180,200)">
    <rect x="0" y="0" width="180" height="8" rx="2" fill="#8d6b4a"/>
    <!-- hanging mugs -->
    <g transform="translate(30,8)">
      <rect x="-14" y="0" width="28" height="30" rx="3" fill="#a14e30"/>
      <path d="M14,6 q10,2 10,12 q0,10 -10,10" fill="none" stroke="#a14e30" stroke-width="3"/>
    </g>
    <g transform="translate(90,8)">
      <rect x="-14" y="0" width="28" height="30" rx="3" fill="#5d8a57"/>
      <path d="M14,6 q10,2 10,12 q0,10 -10,10" fill="none" stroke="#5d8a57" stroke-width="3"/>
    </g>
    <g transform="translate(150,8)">
      <rect x="-14" y="0" width="28" height="30" rx="3" fill="#c4dde6"/>
      <path d="M14,6 q10,2 10,12 q0,10 -10,10" fill="none" stroke="#c4dde6" stroke-width="3"/>
    </g>
  </g>

  <!-- Counter top across whole frame -->
  <rect x="0" y="440" width="1536" height="40" fill="url(#counter)"/>
  <rect x="0" y="436" width="1536" height="8" fill="#d8b890"/>
  <!-- Counter face -->
  <rect x="0" y="480" width="1536" height="288" fill="url(#counterFace)"/>
  <!-- Cabinet panel lines -->
  <g stroke="#5d4a36" stroke-width="3" opacity="0.6">
    <line x1="240" y1="500" x2="240" y2="760"/>
    <line x1="510" y1="500" x2="510" y2="760"/>
    <line x1="870" y1="500" x2="870" y2="760"/>
    <line x1="1180" y1="500" x2="1180" y2="760"/>
    <line x1="1410" y1="500" x2="1410" y2="760"/>
  </g>
  <!-- Cabinet drawer knobs -->
  <g fill="#d8b890">
    <circle cx="120" cy="540" r="5"/>
    <circle cx="370" cy="540" r="5"/>
    <circle cx="690" cy="540" r="5"/>
    <circle cx="1020" cy="540" r="5"/>
    <circle cx="1290" cy="540" r="5"/>
  </g>

  <!-- Sink basin in counter (centered around 691,346 for faucet stream landing area) -->
  <g transform="translate(691,440)">
    <!-- basin opening -->
    <rect x="-150" y="-4" width="300" height="14" rx="6" fill="#3a3a3a"/>
    <rect x="-145" y="0" width="290" height="80" rx="10" fill="#6e6e6e"/>
    <rect x="-138" y="6" width="276" height="70" rx="8" fill="#4d4d4d"/>
    <!-- water pooled in basin -->
    <ellipse cx="0" cy="50" rx="120" ry="14" fill="#9fc6d8" opacity="0.8"/>
    <ellipse cx="-30" cy="48" rx="40" ry="4" fill="#e0eef3" opacity="0.7"/>
    <!-- drain -->
    <circle cx="20" cy="58" r="6" fill="#2a2a2a"/>
  </g>

  <!-- Faucet (arched), stream centered around (691,346) -->
  <g transform="translate(691,360)">
    <!-- base -->
    <rect x="-22" y="60" width="44" height="20" rx="4" fill="#cfd6db"/>
    <rect x="-22" y="60" width="44" height="6" rx="2" fill="#a8b0b6"/>
    <!-- arched neck -->
    <path d="M-14,60 C-14,-30 14,-30 14,60" fill="none" stroke="#cfd6db" stroke-width="18" stroke-linecap="round"/>
    <path d="M-14,60 C-14,-30 14,-30 14,60" fill="none" stroke="#e8ecef" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <!-- spout tip pointing down -->
    <rect x="-12" y="-26" width="24" height="22" rx="4" fill="#cfd6db"/>
    <rect x="-10" y="-8" width="20" height="6" rx="2" fill="#8d99a6"/>
    <!-- handle knob -->
    <circle cx="32" cy="50" r="10" fill="#cfd6db"/>
    <rect x="30" y="40" width="4" height="14" rx="1" fill="#8d99a6"/>
    <!-- Water stream -->
    <rect x="-9" y="-2" width="18" height="100" rx="6" fill="url(#waterStream)"/>
    <rect x="-3" y="0" width="5" height="95" rx="2" fill="#ffffff" opacity="0.75"/>
    <!-- splashes at basin -->
    <g fill="#ffffff" opacity="0.85">
      <ellipse cx="-18" cy="100" rx="6" ry="3"/>
      <ellipse cx="14" cy="102" rx="5" ry="3"/>
      <ellipse cx="0" cy="106" rx="3" ry="2"/>
    </g>
  </g>

  <!-- Drinking glass of water (384,461) -->
  <g transform="translate(384,420)">
    <!-- shadow -->
    <ellipse cx="0" cy="86" rx="40" ry="5" fill="#000000" opacity="0.15"/>
    <!-- glass body -->
    <path d="M-32,-30 L32,-30 L28,80 L-28,80 Z" fill="#cfe4ec" opacity="0.6"/>
    <!-- water inside -->
    <path d="M-30,4 L30,4 L27,78 L-27,78 Z" fill="#9fc6d8" opacity="0.85"/>
    <!-- water surface -->
    <ellipse cx="0" cy="4" rx="30" ry="5" fill="#d8ecf2"/>
    <!-- highlight -->
    <rect x="-22" y="-22" width="4" height="90" rx="2" fill="#ffffff" opacity="0.7"/>
    <rect x="20" y="10" width="3" height="50" rx="1" fill="#ffffff" opacity="0.55"/>
    <!-- rim -->
    <ellipse cx="0" cy="-30" rx="32" ry="6" fill="none" stroke="#b3d3df" stroke-width="2"/>
  </g>

  <!-- Pot on a stove (1075,422) -->
  <g transform="translate(1075,422)">
    <!-- stove top slab -->
    <rect x="-130" y="18" width="260" height="22" rx="4" fill="#3a3a3a"/>
    <rect x="-130" y="18" width="260" height="6" rx="3" fill="#5a5a5a"/>
    <!-- burner -->
    <circle cx="0" cy="32" r="34" fill="#2a2a2a"/>
    <circle cx="0" cy="32" r="28" fill="#3a3a3a"/>
    <g stroke="#a14e30" stroke-width="2" fill="none" opacity="0.7">
      <circle cx="0" cy="32" r="20"/>
      <circle cx="0" cy="32" r="12"/>
    </g>
    <!-- knobs -->
    <circle cx="-100" cy="30" r="7" fill="#cfd6db"/>
    <circle cx="100" cy="30" r="7" fill="#cfd6db"/>
    <!-- pot body -->
    <path d="M-58,-16 L58,-16 L52,32 L-52,32 Z" fill="#5d6973"/>
    <rect x="-62" y="-22" width="124" height="12" rx="4" fill="#6f7e8a"/>
    <!-- pot handles -->
    <path d="M-58,-10 q-18,0 -18,12" fill="none" stroke="#5d6973" stroke-width="6" stroke-linecap="round"/>
    <path d="M58,-10 q18,0 18,12" fill="none" stroke="#5d6973" stroke-width="6" stroke-linecap="round"/>
    <!-- lid line highlight -->
    <rect x="-58" y="-18" width="116" height="3" fill="#b6bec6" opacity="0.7"/>
    <!-- soup glimpse -->
    <ellipse cx="0" cy="-12" rx="52" ry="6" fill="#c8893f" opacity="0.6"/>
    <!-- Steam wisps -->
    <g fill="#ffffff" opacity="0.7">
      <path d="M-30,-30 q-8,-20 0,-40 q8,-20 0,-40" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
      <path d="M0,-30 q-10,-22 0,-44 q10,-22 0,-46" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
      <path d="M30,-30 q8,-20 0,-40 q-8,-20 0,-42" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    </g>
  </g>

  <!-- Small dishtowel hanging from oven handle hint (bottom-right warmth) -->
  <g transform="translate(1300,500)">
    <rect x="-6" y="0" width="60" height="6" rx="2" fill="#cfd6db"/>
    <path d="M2,6 L46,6 L42,80 L6,80 Z" fill="#c4dde6"/>
    <g stroke="#7fb0c4" stroke-width="2">
      <line x1="2" y1="30" x2="46" y2="30"/>
      <line x1="2" y1="50" x2="46" y2="50"/>
    </g>
  </g>

  <!-- A cutting board with a tomato on left counter -->
  <g transform="translate(180,420)">
    <ellipse cx="0" cy="22" rx="70" ry="6" fill="#000000" opacity="0.15"/>
    <rect x="-60" y="0" width="120" height="22" rx="4" fill="#b08758"/>
    <rect x="-60" y="0" width="120" height="5" rx="2" fill="#d8b890"/>
    <circle cx="20" cy="-2" r="14" fill="#c93c3c"/>
    <circle cx="14" cy="-6" r="4" fill="#e87575" opacity="0.8"/>
    <path d="M22,-14 q4,-4 8,0" fill="none" stroke="#3e6b4e" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
