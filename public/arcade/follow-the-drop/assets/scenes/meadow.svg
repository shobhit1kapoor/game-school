<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 768" preserveAspectRatio="xMidYMid slice">
  <!-- Down on the Ground — wildflower meadow after rain, sun breaking through -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fc6d8"/>
      <stop offset="0.5" stop-color="#c9e6f2"/>
      <stop offset="1" stop-color="#e6efd9"/>
    </linearGradient>
    <linearGradient id="hillsFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d9b88"/>
      <stop offset="1" stop-color="#94b09a"/>
    </linearGradient>
    <linearGradient id="hillsMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a9a5f"/>
      <stop offset="1" stop-color="#7ea96d"/>
    </linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#87b06a"/>
      <stop offset="1" stop-color="#4a7355"/>
    </linearGradient>
    <linearGradient id="streamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcdce7"/>
      <stop offset="1" stop-color="#9fc6d8"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.78" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#f6e7b2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f6e7b2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky and warm sun glow -->
  <rect width="1536" height="768" fill="url(#sky)"/>
  <rect width="1536" height="768" fill="url(#sunGlow)"/>

  <!-- Soft drifting clouds, post-rain -->
  <ellipse cx="280" cy="130" rx="160" ry="36" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="1180" cy="100" rx="180" ry="40" fill="#ffffff" opacity="0.45"/>
  <ellipse cx="900" cy="180" rx="120" ry="26" fill="#ffffff" opacity="0.35"/>

  <!-- Far rolling hills -->
  <path d="M0,400 Q200,330 420,380 T820,370 Q1040,330 1240,385 T1536,375 V768 H0 Z" fill="url(#hillsFar)" opacity="0.9"/>

  <!-- Mid rolling hills -->
  <path d="M0,480 Q240,415 490,470 T960,460 Q1190,420 1380,475 T1536,470 V768 H0 Z" fill="url(#hillsMid)"/>

  <!-- Meadow foreground -->
  <path d="M0,540 Q280,500 600,535 T1180,530 Q1360,520 1536,535 V768 H0 Z" fill="url(#meadow)"/>

  <!-- Winding stream, middle-right around (998,461) flowing to distance -->
  <g>
    <path d="M880,430 Q960,448 1020,470 Q1080,500 1130,545 Q1180,600 1240,640 L1290,660 L1320,665 L1330,640 Q1270,580 1210,530 Q1150,485 1090,460 Q1020,440 940,420 Q900,415 880,430 Z" fill="url(#streamGrad)"/>
    <ellipse cx="980" cy="465" rx="40" ry="4" fill="#dceef3" opacity="0.85"/>
    <ellipse cx="1060" cy="510" rx="44" ry="4.5" fill="#dceef3" opacity="0.8"/>
    <ellipse cx="1150" cy="570" rx="50" ry="5" fill="#dceef3" opacity="0.75"/>
    <ellipse cx="1230" cy="630" rx="40" ry="5" fill="#dceef3" opacity="0.7"/>
  </g>

  <!-- Exposed soil patch, bottom-center around (691,676) -->
  <g>
    <path d="M560,650 Q640,635 720,648 Q800,655 830,680 Q820,720 740,720 Q650,718 590,695 Q560,680 560,650 Z" fill="#5d4a36"/>
    <ellipse cx="610" cy="675" rx="6" ry="3" fill="#3d3022"/>
    <ellipse cx="660" cy="690" rx="5" ry="2.5" fill="#3d3022"/>
    <ellipse cx="720" cy="678" rx="6" ry="3" fill="#3d3022"/>
    <ellipse cx="780" cy="688" rx="5" ry="2.5" fill="#3d3022"/>
    <ellipse cx="690" cy="705" rx="7" ry="3" fill="#3d3022"/>
  </g>

  <!-- Grass tufts scattered through meadow -->
  <g stroke="#3e6b4e" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="120" y1="620" x2="118" y2="600"/>
    <line x1="128" y1="622" x2="132" y2="600"/>
    <line x1="200" y1="650" x2="198" y2="628"/>
    <line x1="350" y1="640" x2="354" y2="618"/>
    <line x1="900" y1="640" x2="902" y2="618"/>
    <line x1="1050" y1="660" x2="1048" y2="638"/>
    <line x1="1300" y1="650" x2="1304" y2="628"/>
    <line x1="1400" y1="700" x2="1402" y2="678"/>
  </g>

  <!-- Wildflower cluster, left foreground around (461,576) -->
  <g>
    <!-- stems -->
    <g stroke="#3e6b4e" stroke-width="3" stroke-linecap="round">
      <line x1="380" y1="640" x2="378" y2="580"/>
      <line x1="420" y1="650" x2="424" y2="572"/>
      <line x1="455" y1="635" x2="458" y2="568"/>
      <line x1="490" y1="650" x2="494" y2="585"/>
      <line x1="525" y1="640" x2="528" y2="575"/>
      <line x1="560" y1="655" x2="562" y2="590"/>
      <line x1="410" y1="675" x2="412" y2="615"/>
      <line x1="475" y1="690" x2="478" y2="620"/>
      <line x1="540" y1="685" x2="544" y2="618"/>
    </g>
    <!-- red flowers -->
    <g fill="#c14f2c">
      <circle cx="378" cy="576" r="9"/>
      <circle cx="370" cy="572" r="6"/>
      <circle cx="386" cy="572" r="6"/>
      <circle cx="494" cy="582" r="9"/>
      <circle cx="486" cy="578" r="6"/>
      <circle cx="502" cy="578" r="6"/>
      <circle cx="412" cy="610" r="8"/>
    </g>
    <!-- yellow flowers -->
    <g fill="#f0b03a">
      <circle cx="424" cy="568" r="9"/>
      <circle cx="416" cy="564" r="6"/>
      <circle cx="432" cy="564" r="6"/>
      <circle cx="544" cy="614" r="8"/>
      <circle cx="538" cy="610" r="5"/>
      <circle cx="550" cy="610" r="5"/>
    </g>
    <!-- purple flowers -->
    <g fill="#8e6fa8">
      <circle cx="458" cy="564" r="9"/>
      <circle cx="450" cy="560" r="6"/>
      <circle cx="466" cy="560" r="6"/>
      <circle cx="562" cy="586" r="8"/>
      <circle cx="556" cy="582" r="5"/>
      <circle cx="568" cy="582" r="5"/>
    </g>
    <!-- white flowers -->
    <g fill="#f4efe4">
      <circle cx="528" cy="572" r="9"/>
      <circle cx="520" cy="568" r="6"/>
      <circle cx="536" cy="568" r="6"/>
      <circle cx="478" cy="616" r="8"/>
      <circle cx="472" cy="612" r="5"/>
      <circle cx="484" cy="612" r="5"/>
    </g>
    <!-- yellow centers on white -->
    <g fill="#f0b03a">
      <circle cx="528" cy="572" r="3"/>
      <circle cx="478" cy="616" r="2.5"/>
    </g>
  </g>

  <!-- Scattered far wildflower dots through meadow -->
  <g opacity="0.85">
    <circle cx="240" cy="590" r="4" fill="#f0b03a"/>
    <circle cx="290" cy="610" r="4" fill="#c14f2c"/>
    <circle cx="180" cy="625" r="4" fill="#8e6fa8"/>
    <circle cx="1080" cy="590" r="4" fill="#f0b03a"/>
    <circle cx="1380" cy="615" r="4" fill="#c14f2c"/>
    <circle cx="1450" cy="640" r="4" fill="#f4efe4"/>
    <circle cx="320" cy="565" r="3" fill="#f4efe4"/>
    <circle cx="850" cy="600" r="3" fill="#8e6fa8"/>
  </g>

  <!-- A few water droplets clinging post-rain -->
  <g fill="#dceef3" opacity="0.8">
    <ellipse cx="395" cy="582" rx="2" ry="3"/>
    <ellipse cx="510" cy="588" rx="2" ry="3"/>
    <ellipse cx="465" cy="620" rx="2" ry="3"/>
  </g>
</svg>
